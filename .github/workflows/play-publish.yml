name: Publish to Google Play

# 출시를 시작하는 세 가지 방법
#  1) 태그 푸시   : v1.0 → 내부 테스트 트랙
#  2) 브랜치 푸시 : publish/v1.0 → 내부 테스트 / publish/production/v1.0 → 프로덕션
#                  (Claude 세션 토큰은 태그 푸시·수동 실행이 403이라 이 경로를 쓴다)
#  3) 수동 실행   : Actions 탭에서 트랙·상태를 직접 선택
on:
  push:
    tags: ["v*"]
    branches: ["publish/**"]
  workflow_dispatch:
    inputs:
      track:
        description: "출시 트랙"
        type: choice
        options: [internal, alpha, beta, production]
        default: internal
      status:
        description: "릴리스 상태"
        type: choice
        options: [completed, draft]
        default: completed
      listing:
        description: "스토어 정보·이미지도 갱신"
        type: boolean
        default: true
      notes:
        description: "릴리스 노트"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: play-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 출시 설정 결정
        id: cfg
        env:
          REF: ${{ github.ref }}
          IN_TRACK: ${{ inputs.track }}
          IN_STATUS: ${{ inputs.status }}
          IN_NOTES: ${{ inputs.notes }}
          IN_LISTING: ${{ inputs.listing }}
        run: |
          case "$REF" in
            refs/heads/publish/production*) BRANCH_TRACK="production" ;;
            *) BRANCH_TRACK="internal" ;;
          esac
          TRACK="${IN_TRACK:-$BRANCH_TRACK}"
          STATUS="${IN_STATUS:-completed}"
          NOTES="${IN_NOTES:-${GITHUB_REF_NAME} 릴리스}"
          LISTING="${IN_LISTING:-true}"
          {
            echo "track=$TRACK"
            echo "status=$STATUS"
            echo "notes=$NOTES"
            echo "listing=$LISTING"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### 출시 설정"
            echo "- 트랙 \`$TRACK\` · 상태 \`$STATUS\` · 스토어 정보 갱신 \`$LISTING\`"
            echo "- 릴리스 노트: $NOTES"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 사전 점검 (dry-run)
        run: |
          ls -la release/*.aab
          node tools/play-publish.mjs \
            --track "${{ steps.cfg.outputs.track }}" \
            --status "${{ steps.cfg.outputs.status }}" \
            --dry-run

      - name: 플레이 업로드
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::PLAY_SERVICE_ACCOUNT_JSON 시크릿이 없습니다. store/출시-자동화.md 참고."
            exit 1
          fi
          EXTRA=""
          if [ "${{ steps.cfg.outputs.listing }}" = "true" ]; then EXTRA="--listing"; fi
          node tools/play-publish.mjs \
            --track "${{ steps.cfg.outputs.track }}" \
            --status "${{ steps.cfg.outputs.status }}" \
            $EXTRA \
            --notes "${{ steps.cfg.outputs.notes }}"
          echo "업로드 완료 — 플레이 콘솔에서 확인하세요." >> "$GITHUB_STEP_SUMMARY"
