name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # 폴드노트는 지금까지처럼 사이트 루트에, 단어카드는 /cards/ 에 올린다.
      # (루트를 바꾸면 개인정보처리방침 주소가 깨지므로 app/ 위치는 건드리지 않는다)
      - name: Assemble site
        run: |
          mkdir -p _site/cards
          cp app/* _site/
          cp -r cards/. _site/cards/   # img/ 같은 하위 폴더까지

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
