<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<title>폴드노트</title>
<style>
:root {
  --bg: #F3F1F8;
  --paper: #FFFFFF;
  --paper2: #F9F8FC;
  --ink: #221F2A;
  --ink2: #6B6578;
  --line: #E4E0EE;
  --accent: #6C56C9;
  --accent-ink: #FFFFFF;
  --accent-soft: #ECE7FB;
  --danger: #C94F46;
  --sun: #C4524A;
  --sat: #4A6BC4;
  --shadow: 0 1px 3px rgba(35, 28, 60, .08);
  --hinge: rgba(35, 28, 60, .35);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131118;
    --paper: #1D1A26;
    --paper2: #181521;
    --ink: #EDEAF6;
    --ink2: #9A93AC;
    --line: #2E2A3C;
    --accent: #B3A4F2;
    --accent-ink: #1D1636;
    --accent-soft: #2B2540;
    --danger: #F08A80;
    --sun: #E88A82;
    --sat: #8CA3E8;
    --shadow: 0 1px 4px rgba(0, 0, 0, .4);
    --hinge: rgba(0, 0, 0, .6);
  }
}
:root[data-theme="dark"] {
  --bg: #131118;
  --paper: #1D1A26;
  --paper2: #181521;
  --ink: #EDEAF6;
  --ink2: #9A93AC;
  --line: #2E2A3C;
  --accent: #B3A4F2;
  --accent-ink: #1D1636;
  --accent-soft: #2B2540;
  --danger: #F08A80;
  --sun: #E88A82;
  --sat: #8CA3E8;
  --shadow: 0 1px 4px rgba(0, 0, 0, .4);
  --hinge: rgba(0, 0, 0, .6);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "Segoe UI", Roboto, sans-serif;
  font-size: 15px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
button, input, textarea { font: inherit; color: inherit; }
button { background: none; border: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}

/* ---------- 앱 골격 ---------- */
.app { height: 100%; display: flex; flex-direction: column; }
.content { flex: 1; min-height: 0; }
.view { height: 100%; display: flex; }
.view[hidden] { display: none; }
.pane { display: flex; flex-direction: column; min-width: 0; min-height: 0; height: 100%; }
.list-pane { background: var(--paper2); position: relative; }
.detail-pane { background: var(--paper); }

/* ---------- 내비게이션: 레일(대화면) / 탭바(커버) ---------- */
.rail { display: none; }
.tabbar {
  display: flex;
  border-top: 1px solid var(--line);
  background: var(--paper);
  padding-bottom: env(safe-area-inset-bottom);
}
.nav-btn {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 8px 0 6px;
  color: var(--ink2);
  font-size: 11px;
  letter-spacing: .02em;
}
.nav-btn svg { width: 22px; height: 22px; }
.nav-btn.active { color: var(--accent); }
.logo {
  width: 38px; height: 38px;
  border-radius: 12px;
  background: var(--accent);
  position: relative;
  margin: 0 auto;
}
.logo::before {
  content: "";
  position: absolute;
  top: 18%; bottom: 18%; left: 50%;
  width: 1.5px;
  background: var(--accent-ink);
  opacity: .85;
}
.logo::after {
  content: "";
  position: absolute;
  top: 26%; bottom: 26%; left: 22%; right: 22%;
  border: 1.5px solid var(--accent-ink);
  border-radius: 4px;
  opacity: .85;
}

/* ---------- 목록 공통 ---------- */
.pane-head {
  display: flex;
  align-items: baseline;
  gap: 8px;
  padding: 18px 18px 10px;
}
.pane-head h1 { font-size: 21px; font-weight: 700; letter-spacing: -.01em; }
.count { color: var(--ink2); font-size: 13px; }
.scroll { flex: 1; overflow-y: auto; min-height: 0; }
.search { padding: 0 14px 10px; }
.search input {
  width: 100%;
  border: 1px solid var(--line);
  background: var(--paper);
  border-radius: 10px;
  padding: 9px 12px;
  font-size: 14px;
}
.search input::placeholder { color: var(--ink2); }
#note-list { padding: 0 10px 88px; }
.note-item {
  display: block;
  width: 100%;
  text-align: left;
  padding: 12px;
  border-radius: 12px;
  border: 1px solid transparent;
  margin-bottom: 4px;
}
.note-item:hover { background: var(--accent-soft); }
.note-item.active { background: var(--paper); border-color: var(--line); box-shadow: var(--shadow); }
.note-item-top { display: flex; align-items: center; gap: 6px; }
.note-item-title {
  font-weight: 600;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.pin {
  flex: none;
  font-size: 10px;
  color: var(--accent);
  background: var(--accent-soft);
  border-radius: 99px;
  padding: 1px 7px;
  letter-spacing: .04em;
}
.note-item-snippet {
  color: var(--ink2);
  font-size: 13px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  margin-top: 2px;
}
.note-item-date { color: var(--ink2); font-size: 11.5px; margin-top: 4px; font-variant-numeric: tabular-nums; }
.list-empty {
  text-align: center;
  color: var(--ink2);
  padding: 48px 20px;
  font-size: 14px;
  line-height: 1.8;
}
.fab {
  position: absolute;
  right: 16px;
  bottom: 16px;
  background: var(--accent);
  color: var(--accent-ink);
  border-radius: 99px;
  padding: 12px 20px;
  font-weight: 600;
  font-size: 14px;
  box-shadow: 0 4px 14px rgba(35, 28, 60, .28);
}

/* ---------- 편집기 공통 ---------- */
.editor { display: flex; flex-direction: column; height: 100%; }
.editor[hidden] { display: none; }
.editor-bar {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 10px 12px;
  border-bottom: 1px solid var(--line);
}
.editor-bar .meta { color: var(--ink2); font-size: 12.5px; font-variant-numeric: tabular-nums; padding-left: 4px; }
.spacer { flex: 1; }
.icon-btn {
  width: 38px; height: 38px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 10px;
  color: var(--ink2);
  font-size: 17px;
}
.icon-btn:hover { background: var(--accent-soft); color: var(--ink); }
.icon-btn.active { background: var(--accent-soft); color: var(--accent); }
.icon-btn.danger:hover { color: var(--danger); }
.title-input {
  border: 0;
  background: transparent;
  padding: 16px 20px 4px;
  font-size: 21px;
  font-weight: 700;
  width: 100%;
}
.title-input::placeholder, .body-input::placeholder { color: var(--ink2); opacity: .7; }
.body-input {
  flex: 1;
  border: 0;
  background: transparent;
  resize: none;
  padding: 10px 20px 20px;
  line-height: 1.75;
  font-size: 15px;
  caret-color: var(--accent);
}
.title-input:focus, .body-input:focus, .search input:focus { outline: none; }
.search input:focus { border-color: var(--accent); }
.empty {
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  color: var(--ink2);
  text-align: center;
  line-height: 1.8;
  padding: 20px;
}
.empty[hidden] { display: none; }
.empty-art {
  width: 56px; height: 56px;
  border-radius: 16px;
  background: var(--accent-soft);
  position: relative;
}
.empty-art::before {
  content: "";
  position: absolute;
  inset: 14px 16px;
  border: 1.5px solid var(--accent);
  border-radius: 4px;
}
.empty-art::after {
  content: "";
  position: absolute;
  top: 11px; bottom: 11px; left: 50%;
  width: 1.5px;
  background: var(--accent);
}

/* ---------- 다이어리 ---------- */
.cal-head { align-items: center; justify-content: space-between; }
.cal-nav { display: flex; align-items: center; gap: 2px; }
.chip {
  border: 1px solid var(--line);
  background: var(--paper);
  border-radius: 99px;
  padding: 4px 12px;
  font-size: 12.5px;
  color: var(--ink2);
}
.chip:hover { border-color: var(--accent); color: var(--accent); }
.cal-dow {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  padding: 0 12px;
  text-align: center;
  font-size: 11.5px;
  color: var(--ink2);
  letter-spacing: .06em;
}
.cal-dow .sun { color: var(--sun); }
.cal-dow .sat { color: var(--sat); }
.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 2px;
  padding: 6px 12px 4px;
}
.cal-cell {
  aspect-ratio: 1 / 1.05;
  border-radius: 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  padding-top: 4px;
  gap: 1px;
  border: 1px solid transparent;
  min-height: 44px;
}
.cal-cell .d { font-size: 12px; color: var(--ink2); font-variant-numeric: tabular-nums; }
.cal-cell .e { font-size: 16px; line-height: 1.2; }
.cal-cell .e.dot { color: var(--accent); font-size: 13px; }
.cal-cell:hover { background: var(--accent-soft); }
.cal-cell.today .d { color: var(--accent); font-weight: 700; }
.cal-cell.sel { background: var(--accent-soft); border-color: var(--accent); }
.cal-cell.blank { visibility: hidden; }
.cal-hint { color: var(--ink2); font-size: 12px; padding: 6px 18px 16px; }
.picker-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 20px 0;
}
.picker-label { flex: none; font-size: 12.5px; color: var(--ink2); width: 30px; }
.picker { display: flex; gap: 4px; flex-wrap: wrap; }
.pick-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0;
  border: 1px solid transparent;
  border-radius: 10px;
  padding: 5px 8px 3px;
  min-width: 46px;
}
.pick-btn .pe { font-size: 18px; line-height: 1.3; }
.pick-btn .pl { font-size: 10px; color: var(--ink2); }
.pick-btn:hover { background: var(--accent-soft); }
.pick-btn.active { background: var(--accent-soft); border-color: var(--accent); }
.pick-btn.active .pl { color: var(--accent); font-weight: 600; }
.diary-editor .body-input { margin-top: 8px; border-top: 1px dashed var(--line); padding-top: 14px; }

/* ---------- 다이어리 통계 ---------- */
.stats {
  margin: 8px 12px 4px;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 14px;
  box-shadow: var(--shadow);
}
.stats-row { display: flex; gap: 14px; }
.stat { flex: 1; }
.stat b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
.stat span { font-size: 11.5px; color: var(--ink2); }
.stats h3 { font-size: 12px; color: var(--ink2); font-weight: 600; margin: 12px 0 6px; }
.mood-bar {
  display: flex;
  height: 10px;
  border-radius: 99px;
  overflow: hidden;
  background: var(--accent-soft);
}
.mood-bar i { display: block; height: 100%; }
.mood-legend { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 12px; color: var(--ink2); margin-top: 6px; }

/* ---------- 지난 오늘 ---------- */
.memory {
  display: flex;
  align-items: center;
  gap: 8px;
  width: calc(100% - 40px);
  margin: 10px 20px 0;
  background: var(--accent-soft);
  border: 1px solid transparent;
  border-radius: 12px;
  padding: 10px 12px;
  font-size: 13px;
  text-align: left;
}
.memory:hover { border-color: var(--accent); }
.memory .m-when { color: var(--accent); font-weight: 700; flex: none; }
.memory .m-body { color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- 휴지통 ---------- */
.trash-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 9px 0;
  border-top: 1px solid var(--line);
  font-size: 13.5px;
}
.trash-item:first-child { border-top: 0; }
.trash-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.trash-date { color: var(--ink2); font-size: 11.5px; flex: none; font-variant-numeric: tabular-nums; }
.link-btn { color: var(--accent); font-size: 12.5px; padding: 4px 8px; border-radius: 8px; flex: none; }
.link-btn:hover { background: var(--accent-soft); }
.link-btn.danger { color: var(--danger); }

/* ---------- PIN 잠금 ---------- */
.lock {
  position: fixed;
  inset: 0;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  z-index: 50;
}
.lock[hidden] { display: none; }
.lock .logo { width: 52px; height: 52px; border-radius: 16px; margin: 0 0 6px; }
.lock p { color: var(--ink2); font-size: 14px; }
.lock input {
  border: 1px solid var(--line);
  background: var(--paper);
  border-radius: 12px;
  padding: 12px 16px;
  font-size: 20px;
  letter-spacing: .4em;
  text-align: center;
  width: 200px;
}
.lock input:focus { outline: none; border-color: var(--accent); }
.lock .err { color: var(--danger); font-size: 13px; min-height: 18px; }
.btn-accent {
  background: var(--accent);
  color: var(--accent-ink);
  border-radius: 12px;
  padding: 10px 28px;
  font-weight: 600;
}

/* ---------- 설정 ---------- */
.settings { padding: 4px 16px 90px; display: flex; flex-direction: column; gap: 12px; }
.card {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 16px;
  box-shadow: var(--shadow);
}
.card h2 { font-size: 14px; font-weight: 700; margin-bottom: 10px; letter-spacing: .01em; }
.hint { color: var(--ink2); font-size: 13px; line-height: 1.7; }
.seg {
  display: inline-flex;
  border: 1px solid var(--line);
  border-radius: 10px;
  overflow: hidden;
  margin-bottom: 10px;
}
.seg button { padding: 7px 16px; font-size: 13px; color: var(--ink2); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button.active { background: var(--accent); color: var(--accent-ink); }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.btn {
  display: inline-block;
  border: 1px solid var(--line);
  background: var(--paper2);
  border-radius: 10px;
  padding: 8px 14px;
  font-size: 13px;
  cursor: pointer;
}
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.danger { color: var(--danger); }
.btn.danger:hover { border-color: var(--danger); }

/* ---------- 커버 화면 (한 장 레이아웃) ---------- */
@media (max-width: 699px) {
  .view .pane { width: 100%; flex: none; }
  .app[data-pane="list"] .detail-pane { display: none; }
  .app[data-pane="detail"] .list-pane { display: none; }
  .view.single .pane { display: flex !important; }
}

/* ---------- 메인 화면: 펼침면 레이아웃 ---------- */
@media (min-width: 700px) {
  .tabbar { display: none; }
  /* 내비게이션을 상단 바로 옮겨, 아래 두 쪽이 화면 정중앙에서 갈라지게 한다 */
  .rail {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 8px 14px;
    border-bottom: 1px solid var(--line);
    background: var(--bg);
  }
  .rail .logo { width: 30px; height: 30px; border-radius: 9px; margin-right: 10px; }
  .rail .brand { font-size: 15px; font-weight: 700; letter-spacing: -.01em; }
  .rail .nav-btn {
    flex: none;
    flex-direction: row;
    gap: 6px;
    padding: 7px 14px;
    border-radius: 99px;
    font-size: 13px;
  }
  .rail .nav-btn svg { width: 18px; height: 18px; }
  .rail .nav-btn.active { background: var(--accent-soft); color: var(--accent); }
  /* 실제 힌지 위치(화면 정중앙)와 겹치는 50:50 펼침면 */
  .view { display: grid; grid-template-columns: 1fr 1fr; }
  .view.single { display: flex; justify-content: center; background: var(--paper2); }
  .view.single .pane { max-width: 720px; width: 100%; background: transparent; }
  .list-pane { box-shadow: inset -16px 0 18px -14px var(--hinge); }
  .detail-pane {
    border-left: 1px solid var(--line);
    box-shadow: inset 16px 0 18px -14px var(--hinge);
  }
  .back { display: none; }
}
</style>
</head>
<body>
<div class="app" id="app" data-pane="list">
  <nav class="rail" aria-label="주 메뉴">
    <div class="logo" role="img" aria-label="폴드노트"></div>
    <span class="brand">폴드노트</span>
    <span class="spacer"></span>
    <button class="nav-btn" data-tab="notes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="4.5" y="3.5" width="15" height="17" rx="2.5"></rect><path d="M8.5 8.5h7M8.5 12h7M8.5 15.5h4"></path></svg>
      <span>노트</span>
    </button>
    <button class="nav-btn" data-tab="diary">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"></rect><path d="M3.5 9.5h17M8 2.8v4M16 2.8v4"></path><circle cx="12" cy="15" r="1.6" fill="currentColor" stroke="none"></circle></svg>
      <span>다이어리</span>
    </button>
    <button class="nav-btn" data-tab="settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7.5h16M4 12h16M4 16.5h16"></path><circle cx="9" cy="7.5" r="2" fill="var(--paper)"></circle><circle cx="15" cy="12" r="2" fill="var(--paper)"></circle><circle cx="7.5" cy="16.5" r="2" fill="var(--paper)"></circle></svg>
      <span>설정</span>
    </button>
  </nav>

  <main class="content">
    <!-- 노트 -->
    <section class="view" id="view-notes">
      <div class="pane list-pane">
        <header class="pane-head">
          <h1>노트</h1>
          <span class="count" id="note-count"></span>
        </header>
        <div class="search"><input id="search" type="search" placeholder="노트 검색" autocomplete="off"></div>
        <div class="scroll" id="note-list"></div>
        <button class="fab" id="new-note">＋ 새 노트</button>
      </div>
      <div class="pane detail-pane">
        <div class="editor" id="editor" hidden>
          <div class="editor-bar">
            <button class="icon-btn back" data-back aria-label="목록으로">←</button>
            <span class="meta" id="note-meta"></span>
            <span class="spacer"></span>
            <button class="icon-btn" id="check-btn" title="체크리스트로 전환">☑</button>
            <button class="icon-btn" id="pin-btn" title="위로 고정">📌</button>
            <button class="icon-btn danger" id="del-note" title="노트 삭제">🗑</button>
          </div>
          <input class="title-input" id="note-title" placeholder="제목" autocomplete="off">
          <textarea class="body-input" id="note-body" placeholder="내용을 입력하세요…"></textarea>
        </div>
        <div class="empty" id="editor-empty">
          <div class="empty-art" aria-hidden="true"></div>
          <p>목록에서 노트를 선택하거나<br>새 노트를 만들어 보세요.</p>
        </div>
      </div>
    </section>

    <!-- 다이어리 -->
    <section class="view" id="view-diary" hidden>
      <div class="pane list-pane">
        <header class="pane-head cal-head">
          <h1 id="cal-title"></h1>
          <div class="cal-nav">
            <button class="icon-btn" id="prev-month" aria-label="이전 달">‹</button>
            <button class="chip" id="go-today">오늘</button>
            <button class="icon-btn" id="next-month" aria-label="다음 달">›</button>
          </div>
        </header>
        <div class="scroll">
          <div class="cal-dow" aria-hidden="true"><span class="sun">일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span class="sat">토</span></div>
          <div class="cal-grid" id="cal-grid"></div>
          <div class="stats" id="diary-stats"></div>
          <p class="cal-hint">기록한 날에는 기분 이모지가 표시돼요.</p>
        </div>
      </div>
      <div class="pane detail-pane">
        <div class="editor diary-editor">
          <div class="editor-bar">
            <button class="icon-btn back" data-back aria-label="달력으로">←</button>
            <span class="meta" id="diary-date-label"></span>
            <span class="spacer"></span>
            <button class="icon-btn danger" id="del-diary" title="이 날 기록 지우기">🗑</button>
          </div>
          <div class="picker-row"><span class="picker-label">기분</span><div class="picker" id="mood-picker"></div></div>
          <div class="picker-row"><span class="picker-label">날씨</span><div class="picker" id="weather-picker"></div></div>
          <div class="picker-row"><span class="picker-label">활동</span><div class="picker" id="act-picker"></div></div>
          <div id="memory-slot"></div>
          <textarea class="body-input" id="diary-body" placeholder="오늘 하루는 어땠나요?"></textarea>
        </div>
      </div>
    </section>

    <!-- 설정 -->
    <section class="view single" id="view-settings" hidden>
      <div class="pane">
        <header class="pane-head"><h1>설정</h1></header>
        <div class="scroll settings">
          <div class="card">
            <h2>화면</h2>
            <div class="seg" id="theme-seg" role="group" aria-label="테마">
              <button data-theme-opt="system">시스템</button>
              <button data-theme-opt="light">라이트</button>
              <button data-theme-opt="dark">다크</button>
            </div>
            <p class="hint" id="layout-indicator"></p>
          </div>
          <div class="card">
            <h2>데이터</h2>
            <p class="hint" id="data-stats"></p>
            <div class="btn-row">
              <button class="btn" id="export-btn">JSON 내보내기</button>
              <label class="btn">가져오기<input type="file" id="import-input" accept="application/json,.json" hidden></label>
              <button class="btn danger" id="clear-btn">전체 삭제</button>
            </div>
          </div>
          <div class="card">
            <h2>잠금</h2>
            <p class="hint" id="lock-status"></p>
            <div class="btn-row" id="lock-btns"></div>
          </div>
          <div class="card">
            <h2>휴지통</h2>
            <p class="hint">삭제한 노트는 30일 동안 보관한 뒤 자동으로 지워져요.</p>
            <div id="trash-list"></div>
          </div>
          <div class="card">
            <h2>폴드노트</h2>
            <p class="hint">갤럭시 Z 폴드8에 맞춘 노트·다이어리 앱.<br>커버 화면에서는 한 장씩, 펼치면 수첩 펼침면처럼 두 쪽으로 보여요.<br>모든 데이터는 이 기기(브라우저)에만 저장됩니다.</p>
          </div>
        </div>
      </div>
    </section>
  </main>

  <nav class="tabbar" aria-label="주 메뉴">
    <button class="nav-btn" data-tab="notes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="4.5" y="3.5" width="15" height="17" rx="2.5"></rect><path d="M8.5 8.5h7M8.5 12h7M8.5 15.5h4"></path></svg>
      <span>노트</span>
    </button>
    <button class="nav-btn" data-tab="diary">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"></rect><path d="M3.5 9.5h17M8 2.8v4M16 2.8v4"></path><circle cx="12" cy="15" r="1.6" fill="currentColor" stroke="none"></circle></svg>
      <span>다이어리</span>
    </button>
    <button class="nav-btn" data-tab="settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7.5h16M4 12h16M4 16.5h16"></path><circle cx="9" cy="7.5" r="2" fill="var(--paper)"></circle><circle cx="15" cy="12" r="2" fill="var(--paper)"></circle><circle cx="7.5" cy="16.5" r="2" fill="var(--paper)"></circle></svg>
      <span>설정</span>
    </button>
  </nav>
</div>

<div class="lock" id="lock" hidden>
  <div class="logo" role="img" aria-label="폴드노트"></div>
  <p>PIN을 입력해 잠금을 해제하세요</p>
  <input id="lock-input" type="password" inputmode="numeric" maxlength="8" autocomplete="off" aria-label="PIN 입력">
  <p class="err" id="lock-err"></p>
  <button class="btn-accent" id="lock-open">잠금 해제</button>
</div>

<script>
"use strict";
const KEY = "foldnote.v1";
const $ = (s) => document.querySelector(s);
const $$ = (s) => Array.from(document.querySelectorAll(s));
const DOW = ["일", "월", "화", "수", "목", "금", "토"];
const MOODS = [["😄", "최고"], ["🙂", "좋음"], ["😐", "보통"], ["😔", "우울"], ["😢", "슬픔"], ["😤", "화남"]];
const WEATHER = [["☀️", "맑음"], ["⛅", "조금 흐림"], ["☁️", "흐림"], ["🌧️", "비"], ["🌨️", "눈"], ["🌬️", "바람"]];
const ACTS = [["🏃", "운동"], ["💼", "일"], ["📚", "공부"], ["👥", "모임"], ["✈️", "여행"], ["🍽️", "맛집"], ["🎮", "게임"], ["🛋️", "휴식"]];
const MOOD_COLORS = { "😄": "#F5A623", "🙂": "#7CC576", "😐": "#9AA0AB", "😔": "#7E9BD0", "😢": "#5C79B8", "😤": "#D96C60" };
const CHK_EMPTY = "☐", CHK_DONE = "☑";
const TRASH_KEEP_MS = 30 * 24 * 3600 * 1000;

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) return Object.assign({ notes: [], diary: {}, trash: [], settings: { theme: "system" } }, JSON.parse(raw));
  } catch (e) { /* 손상된 데이터는 초기화 */ }
  return { notes: [], diary: {}, trash: [], settings: { theme: "system" } };
}
function persist() {
  try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) { /* 저장 공간 부족 등 */ }
}

let db = load();
db.trash = (db.trash || []).filter((t) => Date.now() - t.deletedAt < TRASH_KEEP_MS);
const ui = {
  tab: "notes",
  noteId: null,
  month: startOfMonth(new Date()),
  diaryDate: ymd(new Date()),
  search: ""
};

/* ---------- 유틸 ---------- */
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function pad(n) { return String(n).padStart(2, "0"); }
function ymd(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
function parseYmd(s) { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); }
function startOfMonth(d) { return new Date(d.getFullYear(), d.getMonth(), 1); }
function esc(s) { return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function fmtKDate(s) { const d = parseYmd(s); return d.getFullYear() + "년 " + (d.getMonth() + 1) + "월 " + d.getDate() + "일 (" + DOW[d.getDay()] + ")"; }
function fmtDT(ts) { const d = new Date(ts); return (d.getMonth() + 1) + "월 " + d.getDate() + "일 " + pad(d.getHours()) + ":" + pad(d.getMinutes()); }
function fmtShort(ts) {
  const d = new Date(ts), now = new Date();
  return d.getFullYear() === now.getFullYear()
    ? (d.getMonth() + 1) + "월 " + d.getDate() + "일"
    : d.getFullYear() + ". " + (d.getMonth() + 1) + ". " + d.getDate();
}
function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }

/* ---------- 화면 전환 ---------- */
function setPane(p) { $("#app").dataset.pane = p; }
function setTab(t) {
  ui.tab = t;
  $("#view-notes").hidden = t !== "notes";
  $("#view-diary").hidden = t !== "diary";
  $("#view-settings").hidden = t !== "settings";
  $$(".nav-btn").forEach((b) => b.classList.toggle("active", b.dataset.tab === t));
  setPane("list");
  if (t === "settings") renderSettings();
}

/* ---------- 노트 ---------- */
function noteById(id) { return db.notes.find((n) => n.id === id); }
function visibleNotes() {
  const q = ui.search.trim().toLowerCase();
  return db.notes
    .filter((n) => !q || (n.title + "\n" + n.body).toLowerCase().includes(q))
    .sort((a, b) => (b.pinned - a.pinned) || (b.updatedAt - a.updatedAt));
}
function renderNoteList() {
  const list = visibleNotes();
  $("#note-count").textContent = db.notes.length ? db.notes.length + "개" : "";
  if (!list.length) {
    $("#note-list").innerHTML = '<div class="list-empty">' +
      (ui.search.trim() ? "검색 결과가 없어요." : "아직 노트가 없어요.<br>새 노트를 만들어 보세요.") + "</div>";
    return;
  }
  $("#note-list").innerHTML = list.map((n) => {
    const title = n.title.trim() || "제목 없음";
    const snippet = n.body.trim().split("\n")[0].slice(0, 80);
    return '<button class="note-item' + (n.id === ui.noteId ? " active" : "") + '" data-id="' + n.id + '">' +
      '<div class="note-item-top"><span class="note-item-title">' + esc(title) + "</span>" +
      (n.pinned ? '<span class="pin">고정</span>' : "") + "</div>" +
      (snippet ? '<div class="note-item-snippet">' + esc(snippet) + "</div>" : "") +
      '<div class="note-item-date">' + fmtShort(n.updatedAt) + "</div></button>";
  }).join("");
}
function renderEditor() {
  const n = noteById(ui.noteId);
  $("#editor").hidden = !n;
  $("#editor-empty").hidden = !!n;
  if (!n) return;
  $("#note-title").value = n.title;
  $("#note-body").value = n.body;
  $("#pin-btn").classList.toggle("active", !!n.pinned);
  renderNoteMeta(n);
}
function renderNoteMeta(n) {
  $("#note-meta").textContent = fmtDT(n.updatedAt) + " 수정 · " + n.body.length + "자";
}
function openNote(id) {
  ui.noteId = id;
  renderEditor();
  renderNoteList();
  setPane("detail");
}
function newNote() {
  const n = { id: uid(), title: "", body: "", pinned: false, createdAt: Date.now(), updatedAt: Date.now() };
  db.notes.unshift(n);
  persist();
  openNote(n.id);
  $("#note-title").focus();
}
const refreshListSoon = debounce(renderNoteList, 300);
function onNoteInput() {
  const n = noteById(ui.noteId);
  if (!n) return;
  n.title = $("#note-title").value;
  n.body = $("#note-body").value;
  n.updatedAt = Date.now();
  persist();
  renderNoteMeta(n);
  refreshListSoon();
}
function deleteNote() {
  const n = noteById(ui.noteId);
  if (!n) return;
  if (!confirm('노트 "' + (n.title.trim() || "제목 없음") + '"을(를) 휴지통으로 옮길까요?\n30일 동안 보관 후 완전히 삭제돼요.')) return;
  db.notes = db.notes.filter((x) => x.id !== n.id);
  db.trash.unshift(Object.assign({}, n, { deletedAt: Date.now() }));
  ui.noteId = null;
  persist();
  renderEditor();
  renderNoteList();
  setPane("list");
}

/* ---------- 체크리스트 ---------- */
function lineBoundsAt(v, pos) {
  const start = v.lastIndexOf("\n", pos - 1) + 1;
  let end = v.indexOf("\n", pos);
  if (end < 0) end = v.length;
  return [start, end];
}
function replaceLine(ta, start, end, newLine, caretPos) {
  const v = ta.value;
  ta.value = v.slice(0, start) + newLine + v.slice(end);
  ta.selectionStart = ta.selectionEnd = caretPos;
  onNoteInput();
}
function cycleChecklist() {
  const ta = $("#note-body");
  if (!noteById(ui.noteId)) return;
  const pos = ta.selectionStart || 0;
  const [start, end] = lineBoundsAt(ta.value, pos);
  const line = ta.value.slice(start, end);
  let nl;
  if (line.startsWith(CHK_EMPTY + " ")) nl = CHK_DONE + " " + line.slice(2);
  else if (line.startsWith(CHK_DONE + " ")) nl = line.slice(2);
  else nl = CHK_EMPTY + " " + line;
  replaceLine(ta, start, end, nl, Math.max(start, pos + nl.length - line.length));
  ta.focus();
}
function onBodyClick() {
  const ta = $("#note-body");
  const pos = ta.selectionStart || 0;
  const [start, end] = lineBoundsAt(ta.value, pos);
  const line = ta.value.slice(start, end);
  const ch = line.slice(0, 1);
  if ((ch === CHK_EMPTY || ch === CHK_DONE) && pos - start <= 1) {
    const nl = (ch === CHK_EMPTY ? CHK_DONE : CHK_EMPTY) + line.slice(1);
    replaceLine(ta, start, end, nl, pos);
  }
}

/* ---------- 휴지통 ---------- */
function restoreNote(id) {
  const i = db.trash.findIndex((t) => t.id === id);
  if (i < 0) return;
  const n = db.trash.splice(i, 1)[0];
  delete n.deletedAt;
  db.notes.unshift(n);
  persist();
  renderNoteList();
  renderSettings();
}
function purgeNote(id) {
  if (!confirm("이 노트를 완전히 삭제할까요? 되돌릴 수 없어요.")) return;
  db.trash = db.trash.filter((t) => t.id !== id);
  persist();
  renderSettings();
}
function emptyTrash() {
  if (!db.trash.length) return;
  if (!confirm("휴지통의 노트 " + db.trash.length + "개를 완전히 삭제할까요? 되돌릴 수 없어요.")) return;
  db.trash = [];
  persist();
  renderSettings();
}
function renderTrashList() {
  const el = $("#trash-list");
  if (!db.trash.length) {
    el.innerHTML = '<p class="hint">휴지통이 비어 있어요.</p>';
    return;
  }
  el.innerHTML = db.trash.map((t) =>
    '<div class="trash-item"><span class="trash-title">' + esc(t.title.trim() || "제목 없음") + "</span>" +
    '<span class="trash-date">' + fmtShort(t.deletedAt) + " 삭제</span>" +
    '<button class="link-btn" data-restore="' + t.id + '">복원</button>' +
    '<button class="link-btn danger" data-purge="' + t.id + '">삭제</button></div>'
  ).join("") +
  '<div class="btn-row"><button class="btn danger" id="trash-empty">휴지통 비우기</button></div>';
}

/* ---------- 다이어리 ---------- */
function entryFor(date) { return db.diary[date]; }
function ensureEntry(date) {
  if (!db.diary[date]) db.diary[date] = { date: date, mood: null, weather: null, acts: [], body: "", updatedAt: Date.now() };
  return db.diary[date];
}
function pruneEntry(date) {
  const e = db.diary[date];
  if (e && !e.mood && !e.weather && !(e.acts && e.acts.length) && !e.body.trim()) delete db.diary[date];
}
function renderCalendar() {
  const y = ui.month.getFullYear(), m = ui.month.getMonth();
  $("#cal-title").textContent = y + "년 " + (m + 1) + "월";
  const first = new Date(y, m, 1);
  const days = new Date(y, m + 1, 0).getDate();
  const startDow = first.getDay();
  const today = ymd(new Date());
  let html = "";
  for (let i = 0; i < startDow; i++) html += '<span class="cal-cell blank"></span>';
  for (let d = 1; d <= days; d++) {
    const date = y + "-" + pad(m + 1) + "-" + pad(d);
    const e = entryFor(date);
    const mark = e ? (e.mood ? '<span class="e">' + e.mood + "</span>" : '<span class="e dot">●</span>') : "";
    const cls = "cal-cell" + (date === today ? " today" : "") + (date === ui.diaryDate ? " sel" : "");
    html += '<button class="' + cls + '" data-date="' + date + '"><span class="d">' + d + "</span>" + mark + "</button>";
  }
  $("#cal-grid").innerHTML = html;
  renderStats();
}

/* ---------- 통계 · 스트릭 ---------- */
function streakDays() {
  let s = 0;
  const d = new Date();
  if (!db.diary[ymd(d)]) d.setDate(d.getDate() - 1); // 오늘 아직 안 썼으면 어제까지의 연속을 센다
  while (db.diary[ymd(d)]) { s++; d.setDate(d.getDate() - 1); }
  return s;
}
function renderStats() {
  const y = ui.month.getFullYear(), m = ui.month.getMonth();
  const days = new Date(y, m + 1, 0).getDate();
  const moodCounts = {}, actCounts = {};
  let recorded = 0;
  for (let d = 1; d <= days; d++) {
    const e = db.diary[y + "-" + pad(m + 1) + "-" + pad(d)];
    if (!e) continue;
    recorded++;
    if (e.mood) moodCounts[e.mood] = (moodCounts[e.mood] || 0) + 1;
    (e.acts || []).forEach((a) => { actCounts[a] = (actCounts[a] || 0) + 1; });
  }
  const moodTotal = Object.values(moodCounts).reduce((a, b) => a + b, 0);
  const usedMoods = MOODS.filter(([e]) => moodCounts[e]);
  const bar = moodTotal
    ? '<h3>기분 분포</h3><div class="mood-bar">' +
      usedMoods.map(([e]) => '<i style="width:' + (moodCounts[e] / moodTotal * 100).toFixed(1) + '%;background:' + MOOD_COLORS[e] + '"></i>').join("") +
      '</div><div class="mood-legend">' +
      usedMoods.map(([e]) => "<span>" + e + " " + moodCounts[e] + "일</span>").join("") + "</div>"
    : "";
  const topActs = Object.entries(actCounts).sort((a, b) => b[1] - a[1]).slice(0, 3);
  const actsHtml = topActs.length
    ? '<h3>자주 한 활동</h3><div class="mood-legend">' +
      topActs.map(([a, c]) => {
        const label = (ACTS.find((x) => x[0] === a) || [])[1] || "";
        return "<span>" + a + " " + label + " " + c + "회</span>";
      }).join("") + "</div>"
    : "";
  $("#diary-stats").innerHTML =
    '<div class="stats-row">' +
    '<div class="stat"><b>' + recorded + '일</b><span>이 달의 기록</span></div>' +
    '<div class="stat"><b>' + streakDays() + '일</b><span>연속 기록 🔥</span></div>' +
    "</div>" + bar + actsHtml;
}

/* ---------- 지난 오늘 ---------- */
function memoriesFor(date) {
  const d = parseYmd(date);
  const res = [];
  Object.keys(db.diary).forEach((k) => {
    if (k === date) return;
    const kd = parseYmd(k);
    if (kd < d && kd.getMonth() === d.getMonth() && kd.getDate() === d.getDate()) {
      res.push({ label: (d.getFullYear() - kd.getFullYear()) + "년 전 오늘", e: db.diary[k] });
    }
  });
  const prev = new Date(d.getFullYear(), d.getMonth() - 1, d.getDate());
  const pk = ymd(prev);
  if (pk !== date && db.diary[pk]) res.push({ label: "1개월 전 오늘", e: db.diary[pk] });
  return res.slice(0, 2);
}
function renderMemories() {
  const mems = memoriesFor(ui.diaryDate);
  $("#memory-slot").innerHTML = mems.map((m) => {
    const snippet = (m.e.body || "").split("\n")[0].slice(0, 40);
    return '<button class="memory" data-date="' + m.e.date + '">' +
      '<span class="m-when">🕰 ' + m.label + "</span>" +
      '<span class="m-body">' + (m.e.mood ? m.e.mood + " " : "") + (esc(snippet) || "기록 보기") + "</span></button>";
  }).join("");
}
function renderDiaryEditor() {
  const e = entryFor(ui.diaryDate) || {};
  const acts = e.acts || [];
  $("#diary-date-label").textContent = fmtKDate(ui.diaryDate);
  $("#diary-body").value = e.body || "";
  $$("#mood-picker .pick-btn").forEach((b) => b.classList.toggle("active", b.dataset.v === e.mood));
  $$("#weather-picker .pick-btn").forEach((b) => b.classList.toggle("active", b.dataset.v === e.weather));
  $$("#act-picker .pick-btn").forEach((b) => b.classList.toggle("active", acts.includes(b.dataset.v)));
  renderMemories();
}
function selectDate(date) {
  ui.diaryDate = date;
  ui.month = startOfMonth(parseYmd(date));
  renderDiaryEditor();
  renderCalendar();
  setPane("detail");
}
function toggleAct(v) {
  const e = ensureEntry(ui.diaryDate);
  e.acts = e.acts || [];
  const i = e.acts.indexOf(v);
  if (i >= 0) e.acts.splice(i, 1); else e.acts.push(v);
  e.updatedAt = Date.now();
  pruneEntry(ui.diaryDate);
  persist();
  renderDiaryEditor();
  renderStats();
}
const refreshCalSoon = debounce(renderCalendar, 300);
function onDiaryInput() {
  const e = ensureEntry(ui.diaryDate);
  e.body = $("#diary-body").value;
  e.updatedAt = Date.now();
  pruneEntry(ui.diaryDate);
  persist();
  refreshCalSoon();
}
function togglePickerValue(field, v) {
  const e = ensureEntry(ui.diaryDate);
  e[field] = e[field] === v ? null : v;
  e.updatedAt = Date.now();
  pruneEntry(ui.diaryDate);
  persist();
  renderDiaryEditor();
  renderCalendar();
}
function deleteDiary() {
  if (!entryFor(ui.diaryDate)) return;
  if (!confirm(fmtKDate(ui.diaryDate) + " 기록을 지울까요?")) return;
  delete db.diary[ui.diaryDate];
  persist();
  renderDiaryEditor();
  renderCalendar();
}
function shiftMonth(n) {
  ui.month = new Date(ui.month.getFullYear(), ui.month.getMonth() + n, 1);
  renderCalendar();
}

/* ---------- 설정 ---------- */
function applyTheme() {
  const t = db.settings.theme;
  if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  else document.documentElement.removeAttribute("data-theme");
  $$("#theme-seg button").forEach((b) => b.classList.toggle("active", b.dataset.themeOpt === t));
}
const wideMq = matchMedia("(min-width: 700px)");
function renderSettings() {
  applyTheme();
  const dn = Object.keys(db.diary).length;
  $("#data-stats").textContent = "노트 " + db.notes.length + "개 · 다이어리 " + dn + "일 기록 · 휴지통 " + db.trash.length + "개";
  $("#layout-indicator").textContent = wideMq.matches
    ? "지금은 펼침(메인 화면) 레이아웃 — 두 쪽 펼침면으로 보여요."
    : "지금은 커버 화면 레이아웃 — 한 장씩 보여요.";
  renderLockCard();
  renderTrashList();
}

/* ---------- PIN 잠금 ---------- */
function hashPin(pin) {
  let h = 5381;
  const s = "foldnote:" + pin;
  for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0;
  return (h >>> 0).toString(16);
}
function lockNow() {
  if (!db.settings.pinHash) return;
  $("#lock-input").value = "";
  $("#lock-err").textContent = "";
  $("#lock").hidden = false;
  $("#lock-input").focus();
}
function tryUnlock() {
  if (hashPin($("#lock-input").value) === db.settings.pinHash) {
    $("#lock").hidden = true;
  } else {
    $("#lock-err").textContent = "PIN이 맞지 않아요. 다시 입력해 주세요.";
    $("#lock-input").value = "";
    $("#lock-input").focus();
  }
}
function askNewPin() {
  const p1 = prompt("사용할 PIN을 입력하세요 (숫자 4~8자리)");
  if (p1 === null) return null;
  if (!/^\d{4,8}$/.test(p1)) { alert("숫자 4~8자리로 입력해 주세요."); return null; }
  const p2 = prompt("확인을 위해 한 번 더 입력해 주세요");
  if (p2 !== p1) { alert("두 입력이 서로 달라요. 처음부터 다시 시도해 주세요."); return null; }
  return p1;
}
function verifyCurrentPin() {
  const cur = prompt("현재 PIN을 입력하세요");
  if (cur === null) return false;
  if (hashPin(cur) !== db.settings.pinHash) { alert("PIN이 맞지 않아요."); return false; }
  return true;
}
function renderLockCard() {
  const on = !!db.settings.pinHash;
  $("#lock-status").textContent = on
    ? "PIN 잠금이 켜져 있어요. 앱을 열거나 화면을 벗어났다 돌아오면 PIN을 물어봐요."
    : "PIN을 설정하면 앱을 열 때 잠금 화면이 나타나요. 일기를 안전하게 지켜줘요.";
  $("#lock-btns").innerHTML = on
    ? '<button class="btn" data-lock-act="change">PIN 변경</button><button class="btn danger" data-lock-act="off">잠금 끄기</button>'
    : '<button class="btn" data-lock-act="set">PIN 설정</button>';
}
function exportData() {
  const blob = new Blob([JSON.stringify(db, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "foldnote-백업-" + ymd(new Date()) + ".json";
  a.click();
  URL.revokeObjectURL(a.href);
}
function importData(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      if (!Array.isArray(data.notes) || typeof data.diary !== "object") throw new Error("bad shape");
      if (!confirm("현재 데이터를 백업 파일 내용으로 바꿀까요? (노트 " + data.notes.length + "개)")) return;
      db = Object.assign({ notes: [], diary: {}, trash: [], settings: { theme: "system" } }, data);
      ui.noteId = null;
      persist();
      renderAll();
    } catch (e) {
      alert("백업 파일을 읽지 못했어요. 폴드노트에서 내보낸 JSON 파일인지 확인해 주세요.");
    }
  };
  reader.readAsText(file);
}
function clearAll() {
  if (!confirm("노트와 다이어리를 모두 삭제할까요? 되돌릴 수 없어요.")) return;
  db = { notes: [], diary: {}, trash: [], settings: db.settings };
  ui.noteId = null;
  persist();
  renderAll();
}

/* ---------- 데모 데이터 (#demo) ---------- */
function seedDemo() {
  if (db.notes.length || Object.keys(db.diary).length) return;
  const now = Date.now(), H = 3600 * 1000;
  db.notes = [
    { id: uid() + "a", title: "폴드8 구매 체크리스트", body: "☑ 색상: 라벤더\n☑ 용량: 512GB\n☐ 케이스, 보호필름 주문\n☐ 통신사 보상 프로그램 비교", pinned: true, createdAt: now - 50 * H, updatedAt: now - 2 * H },
    { id: uid() + "b", title: "주간 회의 메모", body: "8월 목표 점검\n- 앱 프로토타입 공유\n- 다음 주 일정 조율\n- 리뷰 반영 사항 정리", pinned: false, createdAt: now - 30 * H, updatedAt: now - 20 * H },
    { id: uid() + "c", title: "읽고 싶은 책", body: "1. 도둑맞은 집중력\n2. 아주 작은 습관의 힘\n3. 데미안 (다시 읽기)", pinned: false, createdAt: now - 80 * H, updatedAt: now - 60 * H },
    { id: uid() + "d", title: "제주 여행 준비물", body: "항공권 예약 완료\n렌터카 비교하기\n숙소: 애월 쪽으로\n우비, 선크림, 충전기", pinned: false, createdAt: now - 100 * H, updatedAt: now - 90 * H }
  ];
  const base = new Date();
  const mk = (offset, mood, weather, body, acts) => {
    const d = new Date(base.getFullYear(), base.getMonth(), base.getDate() - offset);
    const k = ymd(d);
    db.diary[k] = { date: k, mood: mood, weather: weather, acts: acts || [], body: body, updatedAt: d.getTime() };
  };
  mk(0, "😄", "☀️", "폴드8 개통! 펼쳤을 때 화면이 생각보다 훨씬 넓다. 노트 앱 만들 생각에 설렌다.", ["🎮", "🍽️"]);
  mk(1, "🙂", "⛅", "오랜만에 한강 산책. 저녁엔 가족들과 삼계탕.", ["🏃", "👥"]);
  mk(2, "😐", "🌧️", "하루 종일 비. 집에서 밀린 정리를 했다.", ["🛋️"]);
  mk(4, "🙂", "☀️", "친구랑 전시 보러 다녀옴. 기록 습관을 만들기로 함.", ["👥", "🍽️"]);
  mk(6, "😔", "☁️", "일이 잘 안 풀린 하루. 일찍 자자.", ["💼"]);
  const pm = new Date(base.getFullYear(), base.getMonth() - 1, base.getDate());
  const pmk = ymd(pm);
  db.diary[pmk] = { date: pmk, mood: "🙂", weather: "☀️", acts: ["✈️"], body: "폴드8 언팩을 기다리며 여행 계획을 세웠다.", updatedAt: pm.getTime() };
  persist();
}

/* ---------- 초기화 ---------- */
function renderAll() {
  applyTheme();
  renderNoteList();
  renderEditor();
  renderCalendar();
  renderDiaryEditor();
  renderSettings();
}
function buildPickers() {
  $("#mood-picker").innerHTML = MOODS.map(([e, l]) =>
    '<button class="pick-btn" data-v="' + e + '"><span class="pe">' + e + '</span><span class="pl">' + l + "</span></button>").join("");
  $("#weather-picker").innerHTML = WEATHER.map(([e, l]) =>
    '<button class="pick-btn" data-v="' + e + '"><span class="pe">' + e + '</span><span class="pl">' + l + "</span></button>").join("");
  $("#act-picker").innerHTML = ACTS.map(([e, l]) =>
    '<button class="pick-btn" data-v="' + e + '"><span class="pe">' + e + '</span><span class="pl">' + l + "</span></button>").join("");
}
function bind() {
  $$(".nav-btn").forEach((b) => b.addEventListener("click", () => setTab(b.dataset.tab)));
  $$("[data-back]").forEach((b) => b.addEventListener("click", () => setPane("list")));
  $("#new-note").addEventListener("click", newNote);
  $("#note-list").addEventListener("click", (ev) => {
    const item = ev.target.closest("[data-id]");
    if (item) openNote(item.dataset.id);
  });
  $("#search").addEventListener("input", (ev) => { ui.search = ev.target.value; renderNoteList(); });
  $("#note-title").addEventListener("input", onNoteInput);
  $("#note-body").addEventListener("input", onNoteInput);
  $("#pin-btn").addEventListener("click", () => {
    const n = noteById(ui.noteId);
    if (!n) return;
    n.pinned = !n.pinned;
    persist();
    renderEditor();
    renderNoteList();
  });
  $("#del-note").addEventListener("click", deleteNote);
  $("#cal-grid").addEventListener("click", (ev) => {
    const cell = ev.target.closest("[data-date]");
    if (cell) selectDate(cell.dataset.date);
  });
  $("#prev-month").addEventListener("click", () => shiftMonth(-1));
  $("#next-month").addEventListener("click", () => shiftMonth(1));
  $("#go-today").addEventListener("click", () => {
    ui.month = startOfMonth(new Date());
    selectDate(ymd(new Date()));
  });
  $("#mood-picker").addEventListener("click", (ev) => {
    const b = ev.target.closest("[data-v]");
    if (b) togglePickerValue("mood", b.dataset.v);
  });
  $("#weather-picker").addEventListener("click", (ev) => {
    const b = ev.target.closest("[data-v]");
    if (b) togglePickerValue("weather", b.dataset.v);
  });
  $("#act-picker").addEventListener("click", (ev) => {
    const b = ev.target.closest("[data-v]");
    if (b) toggleAct(b.dataset.v);
  });
  $("#memory-slot").addEventListener("click", (ev) => {
    const b = ev.target.closest("[data-date]");
    if (b) selectDate(b.dataset.date);
  });
  $("#check-btn").addEventListener("click", cycleChecklist);
  $("#note-body").addEventListener("click", onBodyClick);
  $("#diary-body").addEventListener("input", onDiaryInput);
  $("#del-diary").addEventListener("click", deleteDiary);
  $("#trash-list").addEventListener("click", (ev) => {
    const r = ev.target.closest("[data-restore]");
    if (r) return restoreNote(r.dataset.restore);
    const p = ev.target.closest("[data-purge]");
    if (p) return purgeNote(p.dataset.purge);
    if (ev.target.closest("#trash-empty")) emptyTrash();
  });
  $("#lock-btns").addEventListener("click", (ev) => {
    const b = ev.target.closest("[data-lock-act]");
    if (!b) return;
    const act = b.dataset.lockAct;
    if (act === "set") {
      const p = askNewPin();
      if (p) { db.settings.pinHash = hashPin(p); persist(); renderLockCard(); }
    } else if (act === "change") {
      if (!verifyCurrentPin()) return;
      const p = askNewPin();
      if (p) { db.settings.pinHash = hashPin(p); persist(); renderLockCard(); }
    } else if (act === "off") {
      if (!verifyCurrentPin()) return;
      db.settings.pinHash = null;
      persist();
      renderLockCard();
    }
  });
  $("#lock-open").addEventListener("click", tryUnlock);
  $("#lock-input").addEventListener("keydown", (ev) => { if (ev.key === "Enter") tryUnlock(); });
  document.addEventListener("visibilitychange", () => {
    if (document.hidden && db.settings.pinHash) lockNow();
  });
  $$("#theme-seg button").forEach((b) => b.addEventListener("click", () => {
    db.settings.theme = b.dataset.themeOpt;
    persist();
    applyTheme();
  }));
  $("#export-btn").addEventListener("click", exportData);
  $("#import-input").addEventListener("change", (ev) => {
    if (ev.target.files[0]) importData(ev.target.files[0]);
    ev.target.value = "";
  });
  $("#clear-btn").addEventListener("click", clearAll);
  const onLayoutChange = () => { if (ui.tab === "settings") renderSettings(); };
  if (wideMq.addEventListener) wideMq.addEventListener("change", onLayoutChange);
}

if (location.hash === "#demo") seedDemo();
buildPickers();
bind();
setTab("notes");
/* 펼침 화면에서는 최근 노트를 바로 보여준다 (커버 화면은 목록 먼저) */
if (wideMq.matches && visibleNotes().length) ui.noteId = visibleNotes()[0].id;
renderAll();
if (db.settings.pinHash) lockNow();

if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  navigator.serviceWorker.register("./sw.js").catch(() => { /* 미지원 환경 */ });
}
</script>
